version: "3.9"

services:
  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
    networks:
      - my-network

  postgres:
    image: postgres:latest
    container_name: postgres-server
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langgraph
    ports:
      - "5432:5432"
    networks:
      - my-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow-server
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --allowed-hosts "localhost,127.0.0.1,mlflow:5000,codereviewer,codereviewer:8000,*"
    networks:
      - my-network


  codereviewer:
    container_name: code-reviewer-agent
    image: softmind/code-reviewer-agent
    build: .
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - my-network

networks:
  my-network:
    driver: bridge